<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="w-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35"/>
  
  <!-- Network Circuit Lines / Letter W -->
  <path d="M 16 20 L 26 46 L 32 32 L 38 46 L 48 20" 
        fill="none" 
        stroke="url(#w-grad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Network Tech Nodes -->
  <circle cx="16" cy="20" r="2.5" fill="#e0f2fe"/>
  <circle cx="32" cy="32" r="3" fill="#e0f2fe"/>
  <circle cx="48" cy="20" r="2.5" fill="#e0f2fe"/>
</svg>
